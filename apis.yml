name: Slingshot AI
description: Slingshot AI is a mental-health AI research lab building a foundation model for psychology.
  Its consumer product, Ash, is a voice- and text-based AI companion for mental health support, trained
  on behavioral-health approaches including CBT, DBT, ACT, psychodynamic therapy, and motivational interviewing,
  and shipped as a free iOS and Android app. Founded by Neil Parikh (co-founder of Casper) and Daniel
  Reid Cahn, the company has raised roughly $93M from investors including Andreessen Horowitz (a16z),
  Forerunner Ventures, Menlo Ventures, and Radical Ventures. As of this pass Slingshot AI publishes no
  public developer API, SDK, or developer portal; Ash is a consumer-facing application at talktoash.com.
